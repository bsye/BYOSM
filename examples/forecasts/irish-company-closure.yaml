title: Irish companies closing within 5 years
source: https://opendata.cro.ie/dataset/bf6f837d-0946-4c14-9a99-82cd6980c121/resource/3fef41bc-b8f4-4b10-8434-ce51c29b1bba/download/companies.csv.zip
start: company_reg_date
event: comp_dissolved_date
horizon_years: 5
cutoffs:
  train: [2005, 2007, 2009]
  calib: [2011]
  test: [2016]
backtest: [2013, 2015, 2017, 2019, 2021]
features: [company_type, county, nace_section, object, name_words, holding]
categorical: [company_type, county, nace_section, object]
derived:
  county: {from: company_address_4, steps: [part, frequent]}
  nace_section: {from: nace_v2_code, steps: [{first: {n: 2}}]}
  object: {from: princ_object_code, steps: [{part: {sep: ".", index: 0}}]}
  name_words: {from: company_name, steps: [word_count]}
  holding: {from: company_name, steps: [{contains: {word: HOLDING}}]}
  company_type:
    steps:
      - keywords:
          groups: {GUARANTEE: guarantee, UNLIMITED: unlimited, EXTERNAL: external, PUBLIC LIMITED: plc}
          other: shares
excluded:
  last_ar_date: filed after the cutoff, so it shows the company was still alive
  eircode: issued from 2015, mostly to companies still trading
  company_status: the answer itself
per_cutoff: 40000
