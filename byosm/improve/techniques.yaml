- id: real-data
  title: More real data
  effect: "Adds or widens a labelled public source, so the model sees real inputs from the domain it is scored on."
  paths: [data.hf_sources, "data.hf_sources.*.per_label|max_rows|max_files|partition", data.hf_queries]
  cost: 1.5
  prior: 0.6
  evidence: [https://arxiv.org/abs/2209.06640]
  status: available

- id: data-size
  title: Split sizes
  effect: "Changes how many rows each split holds; a bigger calib or test set tells close models apart."
  paths: ["data.train_size|dev_size|test_size"]
  cost: 1.5
  prior: 0.4
  evidence: [https://arxiv.org/abs/2103.03098]
  status: available

- id: synthetic-data
  title: LLM-written data
  effect: "Lets an LLM write training rows along named axes of variation; gains saturate after a few rows per label."
  paths: ["data.synthetic|per_call|judge", diversity_axes]
  modalities: [text]
  cost: 1.5
  prior: 0.3
  evidence: [https://arxiv.org/abs/2311.06102, https://arxiv.org/abs/2310.07849]
  status: available

- id: targeted-data
  title: Rows aimed at errors
  effect: "Writes hard cases and refine rounds aimed at the labels the model confuses on dev."
  paths: [hard_cases, "train.refine_rounds|refine_examples"]
  modalities: [text]
  cost: 1.5
  prior: 0.5
  evidence: [https://arxiv.org/abs/2310.13671]
  status: available

- id: audio-mix
  title: Audio mixing
  effect: "Changes how clips are mixed and labelled: noise level, gap filling, events per clip, clip length."
  paths: ["data.audio.snr_db|fill_ms|max_events|label_by_energy|clip_seconds"]
  modalities: [audio]
  cost: 1.2
  prior: 0.5
  evidence: []
  status: available

- id: backbone
  title: Backbone
  effect: "Swaps the pretrained encoder, for a domain-pretrained one or the next size up."
  paths: [backbone, "document.text_backbone|image_backbone"]
  cost: 2.0
  prior: 0.5
  evidence: [https://arxiv.org/abs/2507.11412]
  transferable: true
  status: available

- id: schedule
  title: Training schedule
  effect: "Changes epochs, learning rates and batch size; a stable recipe matters, wide sweeps rarely do."
  paths: ["train.epochs|lr_backbone|lr_head|batch_size"]
  cost: 1.0
  prior: 0.4
  evidence: [https://arxiv.org/abs/2006.05987, https://arxiv.org/abs/2106.09204]
  transferable: true
  status: available

- id: pretraining
  title: In-domain pretraining
  effect: "Runs self-supervised steps on the task's own inputs before fine-tuning."
  paths: ["train.pretrain_steps|pretrain_lambda"]
  cost: 1.5
  prior: 0.3
  evidence: [https://arxiv.org/abs/2010.02194]
  transferable: true
  status: available

- id: head
  title: Head and freezing
  effect: "Freezes the encoder, probes the head first, or changes how tokens are pooled."
  paths: ["train.freeze_backbone|probe_epochs|pool"]
  cost: 0.8
  prior: 0.4
  evidence: [https://arxiv.org/abs/2202.10054]
  transferable: true
  status: available

- id: regularisation
  title: Regularisation
  effect: "Layer-wise learning-rate decay and weight averaging; gains fade once the recipe is stable."
  paths: ["train.layer_decay_floor|ema"]
  cost: 1.0
  prior: 0.15
  evidence: [https://arxiv.org/abs/2006.05987]
  transferable: true
  status: available

- id: precision
  title: Numeric precision
  effect: "Trains in lower precision to save time and memory."
  paths: [train.precision]
  cost: 0.8
  prior: 0.1
  evidence: []
  transferable: true
  status: available

- id: document-views
  title: Document views
  effect: "Changes how a document is read: text, image or both, pages, resolution, OCR and view dropout."
  paths: ["document.route|max_pages|max_len|image_size|ocr|dim|modality_dropout"]
  modalities: [document]
  cost: 1.5
  prior: 0.5
  evidence: []
  status: available

- id: multi-rate-forecast
  title: Multi-rate forecasting
  effect: "Forecasts at several sampling rates and mixes the results per quantile, weighted by recent accuracy."
  paths: [predict.rates]
  modalities: [series]
  cost: 0.1
  prior: 0.7
  evidence: [https://huggingface.co/IUseAMouse/timessm-2.5m]
  status: available

- id: forecast-routing
  title: Model per configuration
  effect: "Picks the patch, boosted, ensemble or seasonal naive model per dataset configuration on calib windows."
  paths: [predict.routing]
  modalities: [series]
  cost: 0.1
  prior: 0.7
  evidence: [https://github.com/SalesforceAIResearch/gift-eval]
  status: available

- id: input-layouts
  title: Varied input layouts
  effect: "Trains on several layouts of each pair (marked, json, openai, prose), masks tool names on a share of rows and adds LLM paraphrases of each request."
  paths: ["data.pairs.layouts|mask_names|paraphrases"]
  requires: [data.pairs]
  modalities: [text]
  cost: 1.2
  prior: 0.6
  evidence: [https://arxiv.org/abs/2608.16502]
  status: available

- id: near-miss-negatives
  title: Near-miss negatives
  effect: "Mines negatives that look like positives (nearest, same_category, missing_parameter, removed) and has the judge relabel each one."
  paths: [data.pairs.near_misses]
  requires: [data.pairs]
  modalities: [text]
  cost: 1.3
  prior: 0.6
  evidence: [https://arxiv.org/abs/2310.14192]
  status: available

- id: embedding-head
  title: Embedding-model head
  effect: "Fits a logistic head on a frozen sentence-embedding model, a floor that trains in seconds."
  paths: ["train.method=embedding-head"]
  modalities: [text]
  task_types: [classify]
  cost: 0.2
  prior: 0.5
  evidence: [https://arxiv.org/abs/2209.11055, https://arxiv.org/abs/2003.04807]
  status: available

- id: setfit
  title: Contrastive few-shot
  effect: "Fine-tunes the embedding model on label pairs before the head; strongest below about 30 real rows per label."
  paths: ["train.method=setfit", "train.pairs_per_row|lr_pairs"]
  modalities: [text]
  task_types: [classify]
  cost: 0.6
  prior: 0.5
  evidence: [https://arxiv.org/abs/2209.11055]
  status: available

- id: label-noise
  title: Label-noise cleaning
  effect: "Ranks training rows by out-of-fold loss and drops the worst ones the judge model disagrees with."
  paths: [data.clean_labels]
  modalities: [text]
  cost: 1.3
  prior: 0.4
  evidence: [https://arxiv.org/abs/2205.12702]
  status: available

- id: weight-averaging
  title: Seed soups
  effect: "Averages the weights of a winning recipe's seed runs and ships the soup when it scores at least their mean on calib."
  paths: []
  cost: 0.0
  prior: 0.4
  evidence: [https://arxiv.org/abs/2203.05482, https://arxiv.org/abs/2212.05956]
  status: built-in

- id: ensemble-distillation
  title: Ensemble distillation
  effect: "A student distilled from a seeded recipe learns the averaged predictions of up to three of its seed runs."
  paths: []
  cost: 0.0
  prior: 0.3
  evidence: [https://arxiv.org/html/2506.15692]
  status: built-in

- id: learning-curve
  title: Learning-curve check
  effect: "Trains the promoted recipe on a quarter and a half of its rows; more of the same data is proposed only while the curve still climbs."
  paths: []
  cost: 0.75
  prior: 0.3
  evidence: [https://arxiv.org/abs/2209.06640]
  status: built-in

- id: forecaster-pretraining
  title: Forecaster pretraining v2
  effect: "More training quantiles, contiguous patch masking, augmentation, arcsinh scaling and a synthetic corpus."
  paths: [fit.pretraining]
  modalities: [series]
  cost: 5.0
  prior: 0.5
  evidence: [https://arxiv.org/abs/2505.23719]
  status: available

- id: reinit-top
  title: Re-initialised top layers
  effect: "Re-initialises the top encoder layers so they relearn for the task; pair tasks can also start from the NLI or reranker backbones."
  paths: [train.reinit_layers]
  modalities: [text]
  task_types: [classify]
  cost: 1.0
  prior: 0.3
  evidence: [https://arxiv.org/abs/2006.05987]
  status: available

- id: small-search
  title: Small hyperparameter search
  effect: "TPE proposes numeric training settings from past tries and short-run screening fully trains only the best third."
  paths: []
  cost: 0.0
  prior: 0.3
  evidence: [https://arxiv.org/abs/1810.05934, https://arxiv.org/html/2402.03921]
  status: built-in

- id: consistency
  title: R-Drop and mixup
  effect: "Adds a loss that keeps two dropout passes consistent, or mixes the pooled hidden states of two rows and their labels."
  paths: ["train.rdrop|mixup"]
  modalities: [text]
  task_types: [classify]
  cost: 1.5
  prior: 0.2
  evidence: [https://arxiv.org/abs/2106.14448, https://arxiv.org/abs/2010.02394]
  status: available

- id: quantile-boosting
  title: Quantile boosting with covariates
  effect: "Fits one gradient-boosting model per quantile level, with the calendar of each forecast step as covariates."
  paths: [fit.quantile_boosting]
  modalities: [series]
  cost: 0.5
  prior: 0.3
  evidence: [https://github.com/autogluon/fev]
  status: available

- id: self-training
  title: Self-training
  effect: "The promoted model labels the unlabelled in-domain pool and the rows it is at least this sure of join training."
  paths: [train.self_train]
  modalities: [text]
  task_types: [classify]
  cost: 1.3
  prior: 0.2
  evidence: [https://arxiv.org/abs/2210.17541, https://arxiv.org/abs/2010.02194]
  status: available
