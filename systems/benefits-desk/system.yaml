name: benefits-desk
title: Benefits desk
created: 2026-10-22T01:11:24+02:00
description: Route a member's request about insurance or benefits to the right action while it is typed
nodes:
  intent:
    specialist: benefits-intent
    role: router
    task: Which of 39 support intents a member's request is about
    source:
      dataset: bitext/Bitext-insurance-llm-chatbot-training-dataset
      input_column: instruction
      label_column: intent
tools:
  open_claim:
    when: file_claim
  claim_status:
    when: track_claim
  appeal_claim:
    when: appeal_denied_insurance_claim
  change_cover:
    when: change_coverage
  check_cover:
    when: check_coverage
  add_cover:
    when: upgrade_coverage
  update_details:
    when: change_personal_details
  cancel_policy:
    when: cancel_insurance_policy
  hand_off:
    when: human_agent
  payment_issue:
    when: report_payment_issue
evals:
- name: heldout
  split: builtin
  max_items: 2000
baselines: []
