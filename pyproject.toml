[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byosm"
version = "0.1.0"
description = "BYOSM - Build Your Own Specialist Model: from one sentence to a small, measured, locally-runnable specialist model."
license = {text = "CC-BY-NC-4.0"}
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchaudio>=2.3",
  "torchvision>=0.18",
  "transformers>=4.56",
  "sentencepiece",
  "openpyxl",
  "datasets>=2.20",
  "huggingface_hub>=0.24",
  "numpy",
  "scikit-learn",
  "soundfile",
  "pydantic>=2",
  "pyyaml",
  "typer>=0.12",
  "rich",
  "anthropic>=1.0",
  "openai>=1.40",
  "onnx",
  "onnxruntime",
  "tokenizers",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart"]
dev = ["pytest", "ruff", "httpx", "fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart"]
silero = ["livekit-plugins-silero"]

[project.scripts]
byosm = "byosm.cli:app"

[tool.setuptools.packages.find]
include = ["byosm*"]

[tool.setuptools.package-data]
"byosm.app" = ["static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501", "N812"]
