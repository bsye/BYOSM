name: lease-entities
title: Lease dates, amounts and parties
created: 2026-10-22T00:47:54+02:00
description: find the dates, amounts and parties in a lease agreement
modality: text
task_type: frame
summary: Token-tag every token in a lease-agreement text to identify spans of DATE, AMOUNT, and PARTY (landlord,
  tenant, guarantor, or other named signatory) using BIO tagging.
input_description: A single lease-agreement text (plain text extracted from a PDF or natively typed). May contain
  preamble, recitals, numbered clauses, signature blocks, and exhibits. Length 300–6000 tokens. English-dominant;
  may include corporate suffixes (LLC, Inc., Ltd., Corp.), dollar signs, spelled-out amounts, and various date formats.
labels:
- name: O
  definition: Token is not the first or subsequent word of any DATE, AMOUNT, or PARTY span.
- name: B-DATE
  definition: First token of a calendar date or date-range expression that anchors a lease obligation (commencement,
    termination, notice period anchor, execution date, anniversary). Includes 'January 15, 2025', 'the 1st of March,
    2026', '01/15/2025', 'within 30 days of execution' (the whole phrase). Excludes mere weekdays without a year
    ('on a Monday'), ordinal month references that are part of a recurring schedule but not a specific calendar
    date, and duration expressions used as a lease term ('a term of twenty (20) years') unless tied to a specific
    start/end date.
- name: I-DATE
  definition: Subsequent token of the same DATE span started by B-DATE.
- name: B-AMOUNT
  definition: 'First token of a monetary value expressed as rent, deposit, fee, penalty, or any dollar figure tied
    to an obligation. Includes ''$1,250.00'', ''Two Thousand Dollars'', ''1.50 per square foot'', ''$60,000.00 per
    year''. Excludes: unit prices that are clearly part of a larger formula (tag the final total instead), square-footage
    or room counts, and percentage rates (''50% of charges'').'
- name: I-AMOUNT
  definition: Subsequent token of the same AMOUNT span.
- name: B-PARTY
  definition: 'First token of a named legal signatory or obligor in the lease: the actual Landlord, Tenant, Guarantor,
    Subtenant, or Assignee whose full name (personal or corporate) appears. Includes ''John A. Smith'', ''ABC Corporation'',
    ''42 Oak Street Properties LLC''. Excludes: role-only references without a name (''the Landlord'', ''the Tenant'',
    ''the Parties''), generic descriptors (''heirs, executors, assigns''), agents/property managers not listed as
    signatories, and the drafting attorney.'
- name: I-PARTY
  definition: Subsequent token of the same PARTY span.
positive_label: null
objective:
  metric: span_f1
  target: 0.93
  constraint: 0.95
languages:
- en
diversity_axes:
- name: lease_type
  values:
  - residential fixed-term
  - commercial multi-tenant suite
  - industrial warehouse
  - short-term / month-to-month
  - sublease
  - purchase-and-leaseback
- name: jurisdiction_style
  values:
  - US-standard
  - UK/Commonwealth
  - Canadian
  - Australian
  - international (CISG-style)
- name: structure_format
  values:
  - numbered-clause contract
  - single-paragraph letter agreement
  - form with fill-in blanks
  - multi-page with exhibits and riders
- name: party_complexity
  values:
  - two natural persons
  - landlord LLC + tenant individual
  - three-party (with guarantor)
  - corporate tenant with named officer signatory
  - assignment to successor entity
- name: amount_expression
  values:
  - $numeric
  - spelled-out words
  - dual ($ and words)
  - per-sq-ft unit rate
  - annual total + monthly breakdown
- name: date_expression
  values:
  - full written (January 15, 2025)
  - slash numeric (01/15/2025)
  - ordinal prose (the 1st of March)
  - relative (30 days after execution)
  - range (1/1/2025 – 12/31/2035)
hard_cases:
- Effective as of the 1st day of January, 2025 – date embedded in a full sentence, not a standalone field
- Rent of $1,250.00 per month, plus utilities and parking at $75.00 – two amounts; only the primary rent is the
  AMOUNT for obligation tracking, but both are valid AMOUNT spans
- 'Landlord: 42 Oak Street Properties LLC, by its authorized officer, Michael Chen – is Michael Chen a PARTY (signatory)
  or just an agent?'
- Not to exceed Two Thousand Dollars ($2,000.00) per month – amount expressed in both words and digits; tag the
  first span only, not both
- The parties hereto, Landlord being John A. Smith and Tenant being ABC Corporation (a Delaware corporation) – 'the
  parties' is a role reference (O); the names are PARTY
- Security deposit of One Thousand Dollars ($1,000.00), refundable within thirty (30) days of termination – '30
  days' is a duration, NOT a DATE
- This agreement shall be binding upon the heirs, executors, administrators, and assigns of the parties hereto –
  generic legal descriptors, NOT parties
- Commencing on the 1st of March, 2026, and terminating on the 28th of February, 2036 – two DATE spans in one sentence
- At a rental of $1.50 per square foot per month, the annual rent being $60,000.00 – unit rate AND annual total
  are both AMOUNT; a naive model may tag only the larger number
- Payment due on or before the 1st day of each and every month, commencing the 1st of September, 2025 – recurring
  '1st day' is NOT a DATE; '1st of September, 2025' IS
- The Tenant and the Landlord (collectively, the 'Parties') – all role references, zero PARTY spans
- Sublet to any subtenant – no named entity; 'subtenant' is generic
- In the amount of $500.00 (Five Hundred Dollars) – parenthetical restatement; tag one span, prefer the numeric
  form
- Executed as of this 15th day of June, 2025 – execution date in signature block
- The premises located at 1234 Main Ave, Unit 7B, Springfield, IL 62704 – address is NOT a PARTY or DATE
- Landlord and Tenant shall each be liable for 50% of the common area charges, estimated at $2,400.00 per year –
  '50%' is NOT an AMOUNT; $2,400.00 IS
- This lease is assigned to NewCo, Inc., a successor by merger to OldCo, LLC – both NewCo and OldCo are PARTY (assignee
  and assignor)
- Rent shall increase by $100.00 on the first anniversary – small AMOUNT; 'first anniversary' is a relative DATE
  reference
- The Landlord, represented by its property manager, FirstRate Management Group – property manager acting as agent
  is NOT a PARTY unless also signing
- 'Term: twenty (20) years – duration, NOT a DATE (no specific calendar anchor)'
