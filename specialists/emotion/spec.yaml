name: emotion
title: Emotion
created: 2026-10-20T22:15:14+02:00
description: 'Classify the emotion expressed in a short English text, such as a tweet or a sentence: sadness, joy,
  love, anger, fear or surprise'
modality: text
task_type: classify
summary: Classify the primary emotion expressed in a short English text (single sentence, tweet-style or short social
  media string) into one of six named emotions (sadness, joy, love, anger, fear, surprise). Any text that does not
  clearly express one of these dominates falls into a catch-all neutral-other class (including neutral statements,
  irony/sarcasm without a dominant named emotion, ambiguity, or non-English).
input_description: 'A single short English text: 1–200 words, typically 1–3 sentences. Examples: tweets, status
  updates, short diary lines, one-line quotes, chat messages. Input may or may not contain emoji, hashtags, URLs,
  or profanity. Whitespace and newlines should be normalized to single spaces before tokenization, but emoji should
  be preserved. No document-level context is provided.'
labels:
- name: joy
  definition: 'Primary affect is positive excitement, happiness, delight, triumph, gratitude expressed as celebration,
    or contentment. Signals: "so happy", "yay", "amazing", "finally", "best day", emojis like 🎉😊. Distinguish from
    ''love'' (joy is excited/positive-affective; love is attachment/affection).'
- name: love
  definition: 'Primary affect is romantic/affectionate/compassion toward a person, pet, or being you care for, or
    a declaration of devotion/affection. Signals: "I love you", "miss you", "you''re my everything", "so grateful
    for you", heart emojis ❤️. Not generic ''like'' about objects (a loved song => joy/other).'
- name: sadness
  definition: 'Primary affect is sorrow, grief, disappointment, heartbreak, loss, loneliness, depression, regret.
    Signals: "I miss him", "so sad", "heartbroken", "why did you have to go", "I feel empty".'
- name: anger
  definition: 'Primary affect is irritation, rage, frustration, indignation, hostility. Signals: "unbelievable",
    "I''m done with this", profanity, accusation, "get out", "furious". Distinguish from ''fear'' (anger is approach/aggressive;
    fear is withdrawal/threat).'
- name: fear
  definition: 'Primary affect is anxiety, worry, dread, panic, or a threat/unsafe situation experienced as frightening
    (not necessarily paralytic). Signals: "I''m scared", "what if she doesn''t come back", "this is terrifying",
    "don''t let it in", "sweating bullets".'
- name: surprise
  definition: 'Primary affect is unexpected surprise (positive, negative, or mixed) whose dominant feeling is shock/disbelief,
    not the underlying valence. Signals: "no way", "holy crap, actually", "wait what", "unbelievable" used as reaction
    (note: ''unbelievable'' as exclamation -> surprise; ''unbelievable'' as complaint -> anger), emojis 🤯😲. If the
    text clearly resolves to joy/anger/sadness beyond the initial shock, pick the resolved emotion (e.g., ''surprised
    and so happy to see you again'' -> joy).'
- name: other
  definition: Catch-all. Use when (a) no named emotion dominates, (b) sentiment is neutral (informational, factual,
    question, instruction, status), (c) sarcasm/irony where the intended target emotion is unclear, (d) multiple
    named emotions co-occur with no clear dominance, (e) text is too short (<3 meaningful tokens) or non-English,
    (f) religious/philosophical/abstract statements without affect.
positive_label: null
objective:
  metric: accuracy
  target: 0.9
  constraint: 1.0
languages:
- en
diversity_axes:
- name: register
  values:
  - casual text-speak
  - tweets with hashtags/mentions
  - formal written sentence
  - diary/introspective
  - chat-message style
  - poetic/literary
  - news-style neutral
- name: length
  values:
  - 1-3 words (very short)
  - 4-10 words
  - 11-30 words
  - 31-60 words
  - 61-200 words (short paragraph)
- name: topic_domain
  values:
  - relationships
  - personal life (work, school, money)
  - sports/games
  - music/film/media
  - weather/seasons
  - technology/social
  - health/illness
  - food
  - politics/current events
  - travel
  - pets
  - family/children
- name: sentiment_polarity
  values:
  - positive
  - negative
  - mixed
  - neutral
  - ambiguous/ironic
- name: speaker_persona
  values:
  - teen/young adult
  - adult professional
  - parent
  - elderly
  - athlete/creator
  - student
  - gamer streamer
- name: lexical_style
  values:
  - standard English
  - slang/AAVE
  - texting shorthand (lol, omg, smh)
  - profanity
  - emoji-heavy
  - sarcasm/irony
  - idiomatic expressions
hard_cases:
- 'Sarcasm: ''Oh wonderful, another Monday.'' -> anger (not joy)'
- 'Sarcasm: ''Thanks, I just needed a surprise attack in the middle of dinner.'' -> surprise or anger; should be
  surprise (dominant reaction)'
- '''I can''t believe she actually showed up in person!'' -> surprise (resolved positive but initial shock dominates)'
- '''I''m so mad I could explode'' vs ''I''m so happy I could explode'' -> anger vs joy, same phrasing, different
  lexicon'
- '''Miss you'' -> love (affection), not sadness (both common; ''miss'' in casual romantic/affection context is
  love unless grief is clear like ''I miss him so much, he died'')'
- '''I miss him, he died last week'' -> sadness (grief) rather than love'
- '''Oh my god, I got the job!'' -> joy (gratitude/cel), not surprise (resolved positive)'
- '''Wait, you''re leaving?!'' -> surprise (dominant), not anger/joy'
- '''This is the worst. So scared of what happens next.'' -> fear dominates over anger'
- '''Angry AND sad - I just can''t do this anymore.'' -> other (co-occurring, no clear dominance) OR sadness if
  breakup context; spec: no clear dominance -> other unless one unambiguously dominates'
- '''I love food'' -> joy (positive affect about object, not attachment to a person) OR other, depending: ''I love
  this meal'' -> joy; ''I love you'' -> love'
- '''I love you to death'' -> love (idiom for affection), not fear'
- '''Unbelievable'' alone -> other (too ambiguous, no context for surprise vs anger)'
- '''Unbelievable, the weather in here is killing me'' -> anger (complaint)'
- '''Surprised and happy she remembered my birthday.'' -> joy (resolved positive) per disambiguation rule'
- 'Neutral informational: ''The flight leaves at 6pm tomorrow.'' -> other'
- 'Question with no affect: ''Do we have milk at home?'' -> other'
- 'Emoji-heavy: ''😡😡😡'' -> anger (single-emoji, no words)'
- 'Emoji-only: ''❤️😂'' -> love (affection emoji dominates) or other (mixed) - define: if heart emoji present with
  any affection context, love; if only ''❤️'' alone with no text -> love'
- '''I feel sick.'' -> other (ambiguous: illness vs nausea-disgust not in label set) -> other'
- '''I''m so proud of her.'' -> joy (pride/cel-like positive about person; not love unless romantic context) - define:
  pride/gratitude about someone''s achievement -> joy; affection/attachment -> love'
