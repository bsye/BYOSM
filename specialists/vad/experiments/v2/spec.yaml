name: vad
description: Voice activity detection for a realtime voice agent. For every 10ms of microphone audio, say whether
  a human is speaking. Must ignore background noise, coughs, laughter, door slams, keyboard, crying babies and other
  non-speech human sounds. Runs on-device next to the agent, streaming, in well under 1ms per frame.
modality: audio
task_type: frame
summary: Per-10ms-frame speech vs non-speech on 16kHz mic audio
input_description: 16kHz mono microphone audio, arbitrary background noise, SNR from -5 to 25 dB
labels:
- name: non_speech
  definition: silence, noise, music, and non-verbal human sounds (coughing, laughing, breathing, crying)
- name: speech
  definition: a frame inside an utterance of human speech, including pauses up to ~300ms inside an utterance
positive_label: speech
objective:
  metric: f1
  target: 0.95
  constraint: 0.99
languages:
- en
diversity_axes: []
hard_cases: []
backbone: tiny-crnn
latency_budget_ms: 1.0
frame_hop_ms: 10.0
data:
  synthetic: false
  train_size: 3000
  dev_size: 400
  test_size: 600
  per_call: 25
  judge: true
  hf_queries: []
  hf_sources:
  - dataset: openslr/librispeech_asr
    role: positive
    format: rows
    partition: all
    max_files: 40
    config: clean
    split: validation
    input_column: audio
    label_column: null
    label_map: []
    max_rows: 900
  - dataset: ashraq/esc50
    role: negative
    format: rows
    partition: all
    max_files: 40
    config: null
    split: train
    input_column: audio
    label_column: null
    label_map: []
    max_rows: 2000
  - dataset: nccratliri/vad-human-ava-speech
    role: labeled
    format: segment_files
    partition: train
    max_files: 60
    config: null
    split: train
    input_column: null
    label_column: null
    label_map: []
    max_rows: 6000
  local_dir: null
  audio:
    sample_rate: 16000
    clip_seconds: 4.0
    snr_db:
    - -5.0
    - 25.0
    max_events: 3
    label_by_energy: true
    fill_ms: 300
train:
  pretrain_steps: 800
  pretrain_lambda: 0.05
  epochs: 30
  batch_size: 64
  lr_backbone: 0.002
  lr_head: 0.002
  freeze_backbone: false
  max_len: 128
  refine_rounds: 0
  refine_examples: 0
decision:
  kind: threshold
  threshold: null
  deactivation_offset: 0.15
  min_on_ms: 50.0
  min_off_ms: 550.0
  smooth_alpha_per_32ms: 0.35
evals:
- name: builtin
  kind: builtin
  source: null
  path: null
  max_items: 400
  primary: true
baselines: []
