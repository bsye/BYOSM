name: ner
description: Find person, organisation, location and other names in English news text
modality: text
task_type: frame
summary: Named entity recognition (CoNLL-2003 tags)
input_description: ''
labels:
- name: O
  definition: not part of a named entity
- name: B-PER
  definition: first word of a person
- name: I-PER
  definition: later word of a person
- name: B-ORG
  definition: first word of an organisation
- name: I-ORG
  definition: later word of an organisation
- name: B-LOC
  definition: first word of a location
- name: I-LOC
  definition: later word of a location
- name: B-MISC
  definition: first word of another named entity (nationality, event, product)
- name: I-MISC
  definition: later word of another named entity (nationality, event, product)
positive_label: null
objective:
  metric: span_f1
  target: 0.9
  constraint: 0.99
languages:
- en
diversity_axes: []
hard_cases: []
backbone: hf:distilbert/distilbert-base-cased
latency_budget_ms: 10.0
frame_hop_ms: 10.0
data:
  synthetic: false
  train_size: 3000
  dev_size: 400
  test_size: 600
  per_call: 25
  judge: true
  hf_queries: []
  hf_sources:
  - dataset: BramVanroy/conll2003
    role: labeled
    format: rows
    partition: all
    max_files: 40
    sampling: stream
    per_label: 100
    config: null
    split: train
    input_column: tokens
    label_column: ner_tags
    label_map: []
    max_rows: 20000
  - dataset: BramVanroy/conll2003
    role: labeled
    format: rows
    partition: all
    max_files: 40
    sampling: stream
    per_label: 100
    config: null
    split: validation
    input_column: tokens
    label_column: ner_tags
    label_map: []
    max_rows: 3250
  local_dir: null
  audio:
    sample_rate: 16000
    clip_seconds: 4.0
    snr_db:
    - -5.0
    - 30.0
    max_events: 3
    label_by_energy: true
    fill_ms: 60
train:
  pretrain_steps: 0
  pretrain_lambda: 0.05
  epochs: 13
  batch_size: 32
  lr_backbone: 5.0e-05
  lr_head: 0.001
  freeze_backbone: false
  max_len: 128
  refine_rounds: 2
  refine_examples: 300
  pool: mean
  layer_decay_floor: 0.5
  probe_epochs: 0
  ema: true
  seed: 0
  holdout_test: auto
  precision: auto
  distill_from: null
  distill_alpha: 0.3
  distill_temperature: 2.0
  distill_unlabeled: 20000
decision:
  kind: threshold
  threshold: null
  deactivation_offset: 0.15
  min_on_ms: 50.0
  min_off_ms: 550.0
  smooth_alpha_per_32ms: 0.35
document:
  route: fused
  text_backbone: hf:sentence-transformers/all-MiniLM-L6-v2
  image_backbone: hf:facebook/dinov2-small
  image_pool: mean
  max_pages: 8
  max_len: 256
  image_size: 224
  dpi: 100
  ocr: auto
  dim: 256
  modality_dropout: 0.2
evals:
- name: conll
  kind: hf
  source:
    dataset: BramVanroy/conll2003
    role: labeled
    format: rows
    partition: all
    max_files: 40
    sampling: stream
    per_label: 100
    config: null
    split: test
    input_column: tokens
    label_column: ner_tags
    label_map: []
    max_rows: 5000
  path: null
  max_items: 4000
  primary: true
baselines: []
search: {}
