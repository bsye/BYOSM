hard_cases:
- Certificate of Insurance issued by a broker with the title 'Certificate' on the letterhead → should be 'coi',
  not 'certificate'.
- 'A ''Certificate of Occupancy'' issued by a city → should be ''permit'' (it authorizes occupancy) or ''certificate''?
  Borderline; here ''permit'' if it authorizes, ''certificate'' if it merely attests. Define: ''Certificate of Occupancy''
  → ''permit'' (authorizes use).'
- A 'Commercial Lease Agreement Addendum' signed by tenant only → 'tenant agreement', not 'lease agreement'.
- A 'Lease' between a parent company and a subsidiary that is really a service contract (no real estate) → 'service
  agreement' or 'other', not 'lease'.
- A 10-page 'Vendor Services Agreement' that includes a 'certificate of insurance' appendix → main doc is 'service
  agreement'; do not split by appendix.
- A W-9 form partially filled with a handwritten SSN and a broker cover letter → still 'w9'.
- An 'Insurance Certificate Request Form' (blank, not the COI itself) → 'other', not 'coi'.
- A 'Tenant Estoppel Certificate' → 'other' or 'tenant agreement'? Estoppel certifies lease terms for a lender →
  classify as 'other' (not a lease, not a certificate of fact in the attestation sense, not tenant rules).
- A building permit that is titled 'Building Certificate' → 'permit' (it authorizes construction).
- A 'Service Agreement' between a landlord and tenant that is really a maintenance contract over the building (not
  occupancy) → 'service agreement', not 'lease'.
- A 'Certificate of Incorporation' → 'certificate', not 'permit'.
- A 'Certificate of Good Standing' → 'certificate'.
- A 'Certificate of Insurance' issued as a rider appended to a W-9 bundle → if the main document of the bundle is
  W-9 → 'w9'; label by dominant doc in the bundle, prefer the first page.
- A 'Tenant Agreement' that actually contains rent, square feet, and a full term structure → should be reclassifed
  as 'lease agreement'; the model must use structure (rent schedule, TI, CAM) not just the title word 'tenant'.
- A scanned W-9 where the IRS form layout is distorted and 'Form W-9' is not visible but the line numbers are →
  'w9'.
- A 'Permit to Apply for a Liquor License' (pre-license) → 'permit'.
- An 'Operating Permit' that is actually an annual 'license' (e.g. taxi license) → 'permit'.
- 'A ''Certificate'' that is actually a business license issued by a city → ''permit'' (it authorizes operation),
  not ''certificate''. This is the certificate/permit boundary and must be resolved by: does it authorize an action
  (permit) or attest a fact (certificate)?'
