name: doc-class
title: Legal document type
created: 2026-10-21T15:35:25+02:00
description: classify documents into service agreement, certificate, permit, lease agreement, tenant agreement,
  coi, w9
modality: document
task_type: classify
summary: 'Classify a single business/legal document (PDF or scanned page) into one of seven named categories: service
  agreement, certificate, permit, lease agreement, tenant agreement, COI (certificate of insurance), or W-9. Catch-all
  "other" for anything not matching.'
input_description: 'The full text layer (OCR fallback) plus a rendered preview of the first up-to-4 pages of a business,
  legal, insurance, or tax document. Documents range from 1-15 pages. Typical sources: property-management systems,
  vendor onboarding, procurement, insurance portals, and tax filing. Many arrive as scans with watermarks, headers/footers,
  and attached schedules.'
labels:
- name: service agreement
  definition: 'A contract between a service provider and a client defining scope of services, fees, term, and termination
    — e.g. professional services agreements, vendor SOWs, maintenance contracts, consulting contracts. Key signals:
    ''terms and conditions of service'', ''scope of services'', ''billing'', ''provider/client'', service-specific
    deliverables. Distinct from lease: no real-estate occupancy terms; the ''agreement'' is for services, not for
    premises.'
- name: certificate
  definition: 'A short (1-3 page) document attesting the existence, validity, or state of some entity, qualification,
    or standing — e.g. certificate of good standing, certificate of incorporation, professional license certificate,
    degree certificate, trade/commerce certificate. Key signals: single-sentence attestation language, issuing authority
    seal/signature, a specific certificate number, ''hereby certifies''. EXCLUDES: ''certificate of insurance''
    (which is a COI → label ''coi''). EXCLUDES: permits (which grant an ongoing right/authorization → label ''permit'').
    A ''certificate'' certifies a fact or status; a ''permit'' authorizes an action.'
- name: permit
  definition: 'A government or regulatory authorization to perform a specific action or operate in a specific manner
    — e.g. building permit, health permit, liquor license, operating permit, permit to apply for licenses. Key signals:
    ''by law/order, [agency] grants permission to…'', permit number, expiration date, conditions of granting, jurisdictional
    agency header. Distinct from ''certificate'': a permit authorizes an ACTION (build, operate, serve alcohol);
    a certificate attests a FACT or STATUS. Distinct from ''lease/tenant'': no occupancy/rent terms.'
- name: lease agreement
  definition: 'A contract between a LESSOR (landlord/property owner) and a Lessee (tenant/business occupant) for
    the rental of commercial or residential real estate. Key signals: ''landlord/lessor'', ''tenant/lessee'', ''premises'',
    ''monthly/annual rent'', base rent + CAM/TI allowances, square footage, common area maintenance, ''this Lease''
    or ''Lease Agreement''. EXCLUDES: a tenant-only acknowledgment or rider (→ ''tenant agreement''). EXCLUDES:
    a pure management/service contract over the property (→ ''service agreement''). A lease is the core document
    establishing the tenancy and rent; a tenant agreement is a subordinate document the tenant signs acknowledging
    obligations under an existing lease or building rules.'
- name: tenant agreement
  definition: 'A tenant-signed acknowledgment, rider, addendum, or code-of-conduct document that supplements an
    existing lease but is NOT the core lease itself. Includes: Tenant Acknowledgment of Occupancy, Tenant''s Rules
    & Regulations agreement, Tenant Addendum to Lease, Tenant''s Indemnification Acknowledgment, Tenant''s Certificate
    of Insurance acknowledgment (signed form, not the COI itself), Move-in Condition Report, Tenant estoppel. Key
    signals: ''tenant acknowledge(s)'', ''tenant agree(s)'', signed by tenant only (or tenant+property manager,
    not a full landlord-lease structure), references an existing lease by date/number, shorter (1-4 pages), focused
    on a single obligation (rules, acknowledgment, indemnity, insurance certificate). Distinct from ''lease agreement'':
    no rent schedule, no base/TI/CAM breakdown, no full term-and-termination clause set.'
- name: coi
  definition: 'Certificate of Insurance (COI): a document issued by an insurance broker or carrier confirming that
    a specific insurance policy (general liability, auto, workers'' comp, umbrella) is in force, listing insured,
    policy limits, policy number, effective/expiry dates, and additional-insured language. Typically 1-3 pages,
    often with a broker letterhead. Key signals: ''Certificate of Insurance'', ''policy number'', ''limits of liability'',
    ''additional insured'', ''occurrence'' vs ''claims-made'', ''underlying'', broker/agent issuing. NOTE: the label
    is exactly ''coi'' per user naming, even though it is a type of certificate. Distinct from generic ''certificate''
    (which certifies a fact/status, not insurance coverage).'
- name: w9
  definition: 'IRS Form W-9, Request for Taxpayer Identification Number and Certification, or a substantially equivalent
    in-house W-9-equivalent form (e.g. ''W-9 Certification'', ''W-9 equivalent''). 1-2 pages, specific IRS-form
    layout: Line 1 (name), Line 2 (trade name), Line 3 (address), Line 4 (federal tax classification), Line 5 (TIN/SSN/EIN),
    Line 6 (signature), plus certification checkboxes and a broker/de-broker statement. May also be a filled PDF
    of the actual IRS form. Key signals: ''Form W-9'', ''Taxpayer Identification Number'', specific line-number
    layout, EIN/SSN box, IRS reference. Distinct from ''certificate'' (no generic attestation) and from W-8 series
    (W-8 is a foreign-person form → falls into ''other'' or ''w9'' if the user treats W-8 as in-scope; here W-9
    is the named label only, so W-8/1099 go to ''other'').'
- name: other
  definition: 'Catch-all for anything not matching the seven named classes: W-8BEN/BEN-E, 1099s, invoices, purchase
    orders, proposals (without a signed service agreement structure), estoppel letters, insurance claim forms, board
    resolutions, NDAs, confidentiality agreements, employment agreements, resumes, cover letters, blank/unreadable
    documents, mixed multi-document bundles where no single category dominates.'
