name: doctype
description: 'Classify a business document (PDF or scan) into one of 16 types to route it to the right team: invoice,
  letter, memo, form, email, resume, ...'
modality: document
task_type: classify
summary: 16-way document type classification (RVL-CDIP classes)
input_description: scanned or born-digital business documents, mostly single page, grayscale scans ~1000px
labels:
- name: advertisement
  definition: 'promotional material: ads, product promotions, flyers, posters'
- name: budget
  definition: budget tables, financial plans, cost breakdowns and spending summaries
- name: email
  definition: printed e-mail messages (From/To/Subject headers)
- name: file_folder
  definition: file folder covers, tabs and labels
- name: form
  definition: fill-in forms with fields, boxes and checkboxes
- name: handwritten
  definition: documents that are mostly handwritten
- name: invoice
  definition: 'bills and invoices: amounts due, line items, totals'
- name: letter
  definition: 'formal correspondence: letterhead, salutation, signature'
- name: memo
  definition: internal memoranda (MEMO / TO / FROM / RE headers)
- name: news_article
  definition: newspaper or magazine articles and clippings
- name: presentation
  definition: slides and presentation pages
- name: questionnaire
  definition: surveys and questionnaires with questions to answer
- name: resume
  definition: resumes / CVs and biographical sketches
- name: scientific_publication
  definition: published scientific papers and journal pages
- name: scientific_report
  definition: scientific / technical reports, lab reports
- name: specification
  definition: product or technical specifications, spec sheets
positive_label: null
objective:
  metric: accuracy
  target: 0.92
  constraint: 0.99
languages:
- en
diversity_axes: []
hard_cases: []
backbone: doc
latency_budget_ms: 10.0
frame_hop_ms: 10.0
data:
  synthetic: false
  train_size: 0
  dev_size: 0
  test_size: 0
  per_call: 25
  judge: false
  hf_queries: []
  hf_sources:
  - dataset: chainyo/rvl-cdip
    role: labeled
    format: rows
    partition: all
    max_files: 40
    sampling: balanced
    per_label: 800
    config: null
    split: val
    input_column: image
    label_column: label
    label_map: []
    max_rows: 5000
  local_dir: null
  audio:
    sample_rate: 16000
    clip_seconds: 4.0
    snr_db:
    - -5.0
    - 30.0
    max_events: 3
    label_by_energy: true
    fill_ms: 60
train:
  pretrain_steps: 0
  pretrain_lambda: 0.05
  epochs: 13
  batch_size: 16
  lr_backbone: 3.0e-05
  lr_head: 0.001
  freeze_backbone: false
  max_len: 128
  refine_rounds: 0
  refine_examples: 300
  pool: attention
decision:
  kind: threshold
  threshold: null
  deactivation_offset: 0.15
  min_on_ms: 50.0
  min_off_ms: 550.0
  smooth_alpha_per_32ms: 0.35
document:
  route: fused
  text_backbone: hf:sentence-transformers/all-MiniLM-L6-v2
  image_backbone: hf:microsoft/dit-base
  max_pages: 1
  max_len: 256
  image_size: 224
  dpi: 100
  ocr: auto
  dim: 256
  modality_dropout: 0.2
evals:
- name: builtin
  kind: builtin
  source: null
  path: null
  max_items: 400
  primary: false
- name: rvl
  kind: hf
  source:
    dataset: chainyo/rvl-cdip
    role: labeled
    format: rows
    partition: all
    max_files: 40
    sampling: balanced
    per_label: 60
    config: null
    split: test
    input_column: image
    label_column: label
    label_map: []
    max_rows: 5000
  path: null
  max_items: 2000
  primary: true
baselines:
- hf:microsoft/dit-base-finetuned-rvlcdip
