  dev_size: 400
  test_size: 600
  per_call: 25
  judge: true
  hf_queries: []
  hf_sources:
  - dataset: AmazonScience/massive
    role: labeled
    format: markup
    partition: all
    max_files: 40
    sampling: stream
    per_label: 100
    config: en-US
    split: train
    input_column: utt
    label_column: annot_utt
    label_map: []
    max_rows: 200000
  - dataset: AmazonScience/massive
    role: labeled
    format: markup
    partition: all
    max_files: 40
    sampling: stream
    per_label: 100
    config: en-US
    split: validation
    input_column: utt
    label_column: annot_utt
    label_map: []
    max_rows: 200000
  local_dir: null
