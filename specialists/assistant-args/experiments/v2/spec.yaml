    clip_seconds: 4.0
    snr_db:
    - -5.0
    - 30.0
    max_events: 3
    label_by_energy: true
    fill_ms: 60
train:
  pretrain_steps: 200
  pretrain_lambda: 0.05
  epochs: 13
  batch_size: 32
  lr_backbone: 5.0e-05
  lr_head: 0.001
  freeze_backbone: false
  max_len: 128
  refine_rounds: 2
  refine_examples: 300
  pool: mean
  layer_decay_floor: 0.5
  probe_epochs: 0
  ema: true
  seed: 0
  holdout_test: auto
  precision: auto
  distill_from: null
  distill_alpha: 0.3
  distill_temperature: 2.0
  distill_unlabeled: 20000
decision:
  kind: threshold
  threshold: null
  deactivation_offset: 0.15
  min_on_ms: 50.0
  min_off_ms: 550.0
  smooth_alpha_per_32ms: 0.35
document:
  route: fused
  text_backbone: hf:sentence-transformers/all-MiniLM-L6-v2
  image_backbone: hf:facebook/dinov2-small
  image_pool: mean
  max_pages: 8
  max_len: 256
  image_size: 224
  dpi: 100
  ocr: auto
  dim: 256
  modality_dropout: 0.2
evals:
- name: massive
